name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build portable package
        shell: pwsh
        run: ./build.ps1
      - name: Test multi-monitor fullscreen rules
        shell: pwsh
        run: |
          $test = Start-Process -FilePath ./artifacts/portable/LegionBar.exe -ArgumentList '--self-test-layout' -Wait -PassThru
          if ($test.ExitCode -ne 0) { throw 'Fullscreen regression checks failed.' }
          Get-Content ./artifacts/portable/layout-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: LegionBar-win-x64
          path: artifacts/LegionBar-win-x64.zip
